<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Hollowed — Public Guestbook</title>
<style>
  body{
    background:#000814;
    color:#e6e6e6;
    font-family:"Trebuchet MS",Arial,sans-serif;
    margin:0; padding:0;
  }
  .wrap{ max-width:800px; margin:20px auto; padding:12px; background:rgba(0,0,0,0.7); border:3px dashed #222; }
  h1{ text-align:center; color:#ffcf33; }
  form input, form textarea{ width:100%; margin:6px 0; padding:6px; background:#000; color:#fff; border:1px solid #333; }
  form input[type="submit"]{ cursor:pointer; background:#330000; color:#fff; border:none; padding:8px 12px; }
  .entry{ border-bottom:1px dashed #222; padding:6px; margin-bottom:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Public Guestbook</h1>

  <div id="entries">
    <!-- entries will appear here -->
  </div>

  <form id="gbform">
    <input type="text" id="name" placeholder="Name or Anonymous">
    <textarea id="msg" rows="3" placeholder="Your note / experience"></textarea>
    <input type="submit" value="Sign Guestbook">
  </form>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

  // TODO: Replace with your own Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyCcyRI69XOFJ4rCr6Q4mw27Q2Lqcd-CmEE",
    authDomain: "hollowarchive-guestbook.firebaseapp.com",
    databaseURL: "https://hollowarchive-guestbook-default-rtdb.firebaseio.com",
    projectId: "hollowarchive-guestbook",
    storageBucket: "hollowarchive-guestbook.appspot.com",
    messagingSenderId: "1006972259426",
    appId: "1:1006972259426:web:b3679c7e6bfce9c7ba553b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const guestbookRef = ref(db, 'entries');

  // Show new entries in real-time
  onChildAdded(guestbookRef, (data) => {
    const entry = data.val();
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `<strong>${entry.date}</strong> — ${escapeHtml(entry.msg)} — <em>${escapeHtml(entry.name)}</em>`;
    document.getElementById('entries').prepend(div);
  });

  // Submit new entry
  document.getElementById('gbform').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value || 'Anonymous';
    const msg = document.getElementById('msg').value;
    if(msg.trim().length < 3){ alert('Please write a message'); return; }
    const date = new Date();
    const formatted = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    push(guestbookRef, { name, msg, date: formatted });
    document.getElementById('name').value = '';
    document.getElementById('msg').value = '';
  });

  function escapeHtml(s){ return s.replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
</script>
</body>
</html>
